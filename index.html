<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4bff">
<title>Tijdreis: Jagers &amp; Boeren leren</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Tijdreis: speelse leerapp in de geest van Squla.
   Ontwerp: heldere kleuren, dikke ronde knoppen, sterren, mammoet Mo als gids. */
:root {
  --bg: #eef4ff; --bg2: #dbe9ff; --ink: #1d2140; --mut: #5b6385; --card: #ffffff; --line: #d9e2f5;
  --brand: #5b4bff; --brand-d: #3e30d6; --sun: #ffc83d; --sun-d: #e0a500;
  --green: #22c55e; --green-d: #15a34a; --green-bg: #e3f8ea; --green-ink: #0f6b33;
  --red: #ff4d6d; --red-d: #d92e50; --red-bg: #ffe8ec; --red-ink: #a3182f;
  --lc: #5b4bff;
  --font: "Nunito", ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, sans-serif;
  --disp: "Baloo 2", "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font); font-weight: 600; color: var(--ink); line-height: 1.45;
  background: radial-gradient(1200px 380px at 50% -120px, var(--bg2), transparent 70%), var(--bg);
  min-height: 100vh; -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, h4 { font-family: var(--disp); margin: 0; line-height: 1.15; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
img { max-width: 100%; }
#app { max-width: 680px; margin: 0 auto; }
.pic { display: block; width: 100%; height: auto; border-radius: 14px; background: #fff; -webkit-user-drag: none; user-select: none; }

/* ---- knoppen ---- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 16px; padding: 12px 20px;
  background: var(--brand); color: #fff; font-weight: 800; font-size: 1rem; box-shadow: 0 4px 0 var(--brand-d); transition: transform .08s, box-shadow .08s, filter .15s;
  text-align: center; min-height: 46px;
}
.btn:hover { filter: brightness(1.06); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--brand-d); }
.btn.big { width: 100%; font-size: 1.1rem; padding: 15px 22px; min-height: 54px; }
.btn.small { padding: 9px 16px; min-height: 40px; font-size: .95rem; }
.btn.green { background: var(--green); box-shadow: 0 4px 0 var(--green-d); }
.btn.red { background: var(--red); box-shadow: 0 4px 0 var(--red-d); }
.btn.ghost { background: #fff; color: var(--brand-d); box-shadow: 0 4px 0 var(--line); border: 2px solid var(--line); }
.btn.ghost.red-t { color: var(--red-d); }
.btn:disabled { background: #c9d0e4; box-shadow: 0 4px 0 #aab3cf; color: #fff; cursor: not-allowed; filter: none; }
.btn.ghost:disabled { background: #f1f3fa; color: #9aa3c0; box-shadow: 0 4px 0 var(--line); }
.iconbtn { border: 0; background: #fff; width: 44px; height: 44px; border-radius: 14px; font-size: 1.25rem; font-weight: 800; box-shadow: 0 3px 0 var(--line); border: 2px solid var(--line); line-height: 1; }
.iconbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.link { background: none; border: 0; color: var(--brand-d); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; padding: 10px 4px; margin-top: 6px; }
.linkbtn { background: none; border: 0; color: var(--brand-d); font-weight: 800; padding: 6px 0; text-align: left; }

/* ---- startscherm ---- */
.home, .lvl, .sum { padding: 14px max(16px, env(safe-area-inset-left, 0px)) 40px max(16px, env(safe-area-inset-right, 0px)); }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 6px 0 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { font-size: 2.2rem; background: #fff; border-radius: 18px; width: 56px; height: 56px; display: grid; place-items: center; box-shadow: 0 4px 0 var(--line); border: 2px solid var(--line); }
.brand h1 { font-size: 1.9rem; color: var(--brand-d); font-weight: 800; }
.brand p { color: var(--mut); font-size: .88rem; }
.stats { display: flex; align-items: center; gap: 8px; }
.stat { background: #fff; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 800; box-shadow: 0 3px 0 var(--line); font-variant-numeric: tabular-nums; }
.mam { display: flex; gap: 12px; align-items: flex-end; margin: 10px 0 16px; }
.mam-e { font-size: 3.4rem; line-height: 1; flex: none; filter: drop-shadow(0 4px 0 rgba(0,0,0,.08)); }
.bubble { position: relative; background: #fff; border: 2px solid var(--line); border-radius: 20px; padding: 12px 16px; box-shadow: 0 4px 0 var(--line); min-width: 0; }
.bubble::before { content: ""; position: absolute; left: -9px; bottom: 18px; width: 14px; height: 14px; background: #fff; border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }
.herhaal { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; border: 0; border-radius: 22px; padding: 14px 18px; color: #fff; background: linear-gradient(135deg, #7c6bff, var(--brand)); box-shadow: 0 5px 0 var(--brand-d); margin-bottom: 8px; }
.herhaal:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--brand-d); }
.herhaal .h-e { font-size: 2rem; }
.herhaal b { font-family: var(--disp); font-size: 1.25rem; display: block; }
.herhaal small { display: block; font-size: .85rem; font-weight: 700; opacity: .92; }
.herhaal.off { background: #c9d0e4; box-shadow: 0 5px 0 #aab3cf; }
.sec { font-size: 1.3rem; margin: 22px 0 12px; color: var(--ink); }
.path { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; position: relative; }
.lv:nth-child(odd) { margin-right: 22px; } .lv:nth-child(even) { margin-left: 22px; }
.lv-btn { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 24px; padding: 12px 14px; box-shadow: 0 5px 0 var(--line); }
.lv-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.lv.current .lv-btn { border-color: var(--lc); box-shadow: 0 5px 0 var(--lc); animation: pulse 2.4s ease-in-out infinite; }
.lv.done .lv-btn { border-color: color-mix(in srgb, var(--lc) 45%, #fff); }
.lv.locked .lv-btn { background: #f1f3fa; box-shadow: 0 5px 0 #dfe4f2; color: #7b84a5; }
.lv.locked .ring { filter: grayscale(1); opacity: .7; }
.ring { flex: none; width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--lc) calc(var(--p) * 1%), #e6eaf6 0); }
.ring .em { width: 62px; height: 62px; border-radius: 50%; background: color-mix(in srgb, var(--lc) 14%, #fff); display: grid; place-items: center; font-size: 2rem; }
.lv-txt { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.lv-n { font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--lc); }
.lv.locked .lv-n { color: #8a93b3; }
.lv-t { font-family: var(--disp); font-size: 1.28rem; line-height: 1.15; font-weight: 700; }
.lv-s { color: var(--mut); font-size: .88rem; }
.lv.locked .lv-s { color: #8a93b3; }
.pips { display: flex; align-items: center; gap: 5px; margin-top: 6px; }
.pips i { width: 22px; height: 8px; border-radius: 99px; background: #e0e5f3; }
.pips i.on { background: var(--lc); }
.pips em { font-style: normal; font-size: .82rem; font-weight: 800; margin-left: 6px; color: var(--mut); }
.chev { font-size: 1.8rem; color: #a3acc9; font-weight: 800; }
.tlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.tcard { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: #fff; border: 2px solid var(--line); border-radius: 20px; padding: 14px 16px; box-shadow: 0 4px 0 var(--line); }
.tcard > div { display: flex; flex-direction: column; min-width: 0; }
.tcard b { font-family: var(--disp); font-size: 1.2rem; }
.tcard span { color: var(--mut); font-size: .88rem; }
.tcard em { font-style: normal; color: var(--green-ink); font-weight: 800; font-size: .9rem; margin-top: 4px; }
.tlock { display: flex; gap: 14px; align-items: center; background: #f1f3fa; border: 2px dashed #c3cbe2; border-radius: 20px; padding: 16px; color: var(--mut); }
.tlock span { font-size: 2rem; }
.foot { text-align: center; color: var(--mut); font-size: .85rem; margin-top: 26px; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.015); } }

/* ---- levelscherm ---- */
.top2 { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-weight: 800; font-family: var(--disp); font-size: 1.15rem; }
.hero { text-align: center; padding: 14px 8px 18px; }
.bigem { width: 110px; height: 110px; margin: 0 auto 10px; border-radius: 34px; display: grid; place-items: center; font-size: 3.8rem; background: color-mix(in srgb, var(--lc) 18%, #fff); border: 3px solid var(--lc); box-shadow: 0 6px 0 var(--lc); }
.hero h1 { font-size: 2rem; color: color-mix(in srgb, var(--lc) 70%, #000); }
.hero p { color: var(--mut); margin-top: 6px; }
.study { background: #fff; border: 2px solid var(--line); border-radius: 22px; box-shadow: 0 4px 0 var(--line); margin: 6px 0 4px; overflow: hidden; }
.study summary { padding: 14px 18px; font-family: var(--disp); font-weight: 700; font-size: 1.2rem; cursor: pointer; list-style: none; display: flex; align-items: baseline; gap: 10px; }
.study summary::-webkit-details-marker { display: none; }
.study summary::after { content: "▾"; margin-left: auto; color: var(--mut); }
.study[open] summary::after { content: "▴"; }
.study summary small { font-family: var(--font); font-weight: 700; color: var(--mut); font-size: .85rem; }
.study-in { padding: 0 18px 18px; }
.sgrid { display: grid; gap: 10px; margin-bottom: 14px; grid-template-columns: repeat(3, 1fr); }
.sgrid.n1 { grid-template-columns: 1fr; } .sgrid.n2 { grid-template-columns: repeat(2, 1fr); }
.sgrid .pic { height: 100%; object-fit: cover; aspect-ratio: 4/3; }
.sgrid.n1 .pic { aspect-ratio: auto; }
.spoints { margin: 0; padding-left: 20px; display: grid; gap: 9px; }
.spoints li::marker { color: var(--lc); }
.spoints b { color: color-mix(in srgb, var(--lc) 75%, #000); }
.tl { width: 100%; height: auto; margin: 4px 0 0; display: block; }
.tl-a { fill: #f97316; } .tl-b { fill: #22c55e; } .tl-l { stroke: var(--ink); stroke-width: 1.5; }
.tl-t { font: 700 12px var(--font); fill: var(--ink); } .tl-in { font: 800 12px var(--font); fill: #fff; }
.cap { color: var(--mut); font-size: .85rem; margin: 2px 0 14px; }
.rounds { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.rd button { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 20px; padding: 12px 14px; box-shadow: 0 4px 0 var(--line); }
.rd button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.rd.passed button { border-color: var(--green); box-shadow: 0 4px 0 var(--green); }
.rd.locked button { background: #f1f3fa; color: #8a93b3; box-shadow: 0 4px 0 #dfe4f2; }
.rn { font-size: 1.7rem; flex: none; width: 46px; height: 46px; display: grid; place-items: center; background: #f1f3fa; border-radius: 14px; }
.rt { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.rt b { font-family: var(--disp); font-size: 1.1rem; }
.rt small { color: var(--mut); font-size: .85rem; }
.rd.locked .rt small { color: #8a93b3; }
.rstars { display: flex; flex-direction: column; align-items: flex-end; flex: none; }
.rstars i { font-style: normal; color: #d3d9ea; font-size: 1.15rem; display: inline-block; }
.rstars i.on { color: var(--sun); text-shadow: 0 1px 0 var(--sun-d); }
.rstars small { color: var(--mut); font-size: .75rem; }
.note { color: var(--mut); font-size: .9rem; margin-top: 16px; }

/* ---- ronde en toets ---- */
.run { min-height: 100vh; display: flex; flex-direction: column; }
.run-top { display: flex; align-items: center; gap: 12px; padding: 12px max(16px, env(safe-area-inset-left, 0px)) 8px max(16px, env(safe-area-inset-right, 0px)); position: sticky; top: 0; z-index: 5; background: linear-gradient(var(--bg) 78%, transparent); }
.bar { flex: 1; height: 16px; background: #dfe5f4; border-radius: 99px; overflow: hidden; box-shadow: inset 0 2px 0 rgba(0,0,0,.06); }
.bar i { display: block; height: 100%; width: 0; background: var(--lc); border-radius: 99px; transition: width .35s cubic-bezier(.3,.9,.3,1); position: relative; }
.bar i::after { content: ""; position: absolute; left: 8px; right: 8px; top: 3px; height: 4px; background: rgba(255,255,255,.4); border-radius: 99px; }
.cnt { font-weight: 800; color: var(--mut); min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
.run-main { flex: 1; padding: 6px max(16px, env(safe-area-inset-left, 0px)) 190px max(16px, env(safe-area-inset-right, 0px)); }
.qwrap { animation: slide .28s ease-out; }
@keyframes slide { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
.qcard { background: #fff; border: 2px solid var(--line); border-radius: 26px; padding: 18px; box-shadow: 0 5px 0 var(--line); }
.qtop { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.tag { background: color-mix(in srgb, var(--lc) 16%, #fff); color: color-mix(in srgb, var(--lc) 75%, #000); border-radius: 99px; padding: 4px 12px; font-size: .8rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
.tag.retry { background: #fff1d6; color: #8a5a00; }
.tts { margin-left: auto; border: 0; background: #f1f3fa; border-radius: 12px; width: 38px; height: 38px; font-size: 1.1rem; }
.qimg { margin: 0 0 14px; max-height: 300px; object-fit: contain; background: #f6f8fd; }
.qt { font-size: 1.4rem; font-weight: 700; margin-bottom: 16px; white-space: pre-line; }
.qt .blank { display: inline-block; min-width: 80px; border-bottom: 4px solid var(--lc); margin: 0 4px; vertical-align: baseline; }
.hint { color: var(--mut); font-size: .9rem; margin: -8px 0 12px; }
.gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
.gallery figure { margin: 0; position: relative; }
.gallery figcaption { position: absolute; left: 8px; top: 8px; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 800; }
.gallery .pic { aspect-ratio: 4/3; object-fit: cover; }

.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 12px 14px; box-shadow: 0 3px 0 var(--line); font-weight: 700; transition: transform .06s; }
.opt:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.opt .let { flex: none; width: 32px; height: 32px; border-radius: 10px; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; color: var(--mut); background: #fff; }
.opt.sel { border-color: var(--brand); background: #efedff; box-shadow: 0 3px 0 var(--brand); }
.opt.sel .let { background: var(--brand); border-color: var(--brand); color: #fff; }
.opt.right { border-color: var(--green); background: var(--green-bg); box-shadow: 0 3px 0 var(--green); }
.opt.right .let { background: var(--green); border-color: var(--green); color: #fff; }
.opt.wrong { border-color: var(--red); background: var(--red-bg); box-shadow: 0 3px 0 var(--red); }
.opt.wrong .let { background: var(--red); border-color: var(--red); color: #fff; }
.opt:disabled { cursor: default; color: inherit; }
.tf .opt { justify-content: center; font-size: 1.15rem; padding: 18px; }
.optgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.imgopt { flex-direction: column; align-items: stretch; padding: 8px; position: relative; }
.imgopt .let { position: absolute; left: 14px; top: 14px; z-index: 1; box-shadow: 0 2px 0 rgba(0,0,0,.2); }
.imgopt .pic { aspect-ratio: 4/3; object-fit: cover; }

.cats { display: grid; gap: 10px; }
.crow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: #f6f8fd; border: 2px solid transparent; border-radius: 16px; padding: 10px 12px; }
.crow.rok { border-color: var(--green); background: var(--green-bg); } .crow.rbad { border-color: var(--red); background: var(--red-bg); }
.ctx { font-weight: 800; flex: 1 1 150px; min-width: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 7px 12px; font-weight: 800; font-size: .9rem; box-shadow: 0 2px 0 var(--line); }
.chip.on { border-color: var(--brand); background: #efedff; color: var(--brand-d); box-shadow: 0 2px 0 var(--brand); }
.chip.right { border-color: var(--green); background: var(--green); color: #fff; box-shadow: 0 2px 0 var(--green-d); }
.chip.wrong { border-color: var(--red); background: var(--red); color: #fff; box-shadow: 0 2px 0 var(--red-d); }
.chip:disabled { cursor: default; }

.ord-ans { min-height: 64px; display: grid; gap: 8px; padding: 10px; border: 2px dashed var(--line); border-radius: 18px; margin-bottom: 14px; background: #fafbff; }
.ord-ph { color: var(--mut); font-size: .92rem; align-self: center; text-align: center; }
.ord-pool { display: grid; gap: 8px; }
.ochip { display: flex; align-items: center; gap: 10px; text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; font-weight: 700; box-shadow: 0 3px 0 var(--line); width: 100%; }
.ochip.placed { border-color: var(--brand); background: #efedff; }
.ochip .num { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: .9rem; }
.ochip.placed.right { border-color: var(--green); background: var(--green-bg); } .ochip.placed.right .num { background: var(--green); }
.ochip.placed.wrong { border-color: var(--red); background: var(--red-bg); } .ochip.placed.wrong .num { background: var(--red); }
.ochip:disabled { cursor: default; }
.olist { margin: 6px 0 0; padding-left: 22px; }

.cloze { font-size: 1.2rem; line-height: 2.5; margin-bottom: 14px; font-weight: 700; }
.gap { display: inline-block; min-width: 92px; height: 38px; vertical-align: middle; margin: 0 3px; border: 0; border-bottom: 4px solid #b9c3de; background: #f1f3fa; border-radius: 10px 10px 4px 4px; padding: 0 10px; font-weight: 800; color: var(--brand-d); }
.gap.focus { border-bottom-color: var(--brand); background: #efedff; box-shadow: 0 0 0 3px #d9d4ff; }
.gap.filled { background: #efedff; border-bottom-color: var(--brand); }
.gap.right { background: var(--green-bg); border-bottom-color: var(--green); color: var(--green-ink); }
.gap.wrong { background: var(--red-bg); border-bottom-color: var(--red); color: var(--red-ink); }
.gap:disabled { cursor: default; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; border-top: 2px dashed var(--line); }
.wchip { border: 2px solid var(--line); background: #fff; border-radius: 12px; padding: 8px 14px; font-weight: 800; box-shadow: 0 3px 0 var(--line); }
.wchip:disabled { opacity: .35; box-shadow: none; cursor: default; }

.txt { width: 100%; border: 2px solid var(--line); border-radius: 16px; padding: 13px 14px; font: inherit; font-weight: 700; font-size: 1.1rem; background: #fff; color: var(--ink); resize: vertical; }
.txt:focus { border-color: var(--brand); outline: 0; box-shadow: 0 0 0 3px #d9d4ff; }
.txt.right { border-color: var(--green); background: var(--green-bg); } .txt.wrong { border-color: var(--red); background: var(--red-bg); }
.inwrap { display: flex; gap: 10px; align-items: flex-start; }
.inwrap .txt { flex: 1; min-width: 0; }
.mic { border: 0; background: var(--brand); color: #fff; border-radius: 16px; box-shadow: 0 4px 0 var(--brand-d); display: grid; place-items: center; flex: none; }
.mic.small { width: 54px; height: 54px; font-size: 1.5rem; }
.mic.big { width: 92px; height: 92px; font-size: 2.6rem; border-radius: 50%; margin: 0 auto; box-shadow: 0 6px 0 var(--brand-d); }
.mic.on { background: var(--red); box-shadow: 0 4px 0 var(--red-d); animation: rec 1.1s ease-in-out infinite; }
@keyframes rec { 0%, 100% { box-shadow: 0 4px 0 var(--red-d), 0 0 0 0 rgba(255,77,109,.5); } 50% { box-shadow: 0 4px 0 var(--red-d), 0 0 0 16px rgba(255,77,109,0); } }
.voice { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0 16px; }
.mic-hint { color: var(--mut); font-size: .92rem; text-align: center; margin-top: 4px; }
.qa .txt + .link, .qa .inwrap + .link { display: block; margin-inline: auto; }

/* ---- feedback onderaan ---- */
.run-foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; padding: 14px max(16px, env(safe-area-inset-left, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); background: #fff; border-top: 2px solid var(--line); }
.run-foot > .btn, .fb-in, .fb-btns, .tnav { max-width: 680px; margin-inline: auto; }
.run-foot > .btn { display: flex; }
.run-foot.tnav { display: flex; gap: 12px; }
.run-foot.tnav .btn { flex: 1; } .run-foot.tnav .btn.ghost { flex: 0 0 38%; }
.run-foot:has(.fb) { padding: 0; border-top: 0; }
.fb { padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); animation: up .25s ease-out; }
.fb.ok { background: var(--green-bg); color: var(--green-ink); } .fb.bad { background: var(--red-bg); color: var(--red-ink); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.fb-in { margin-bottom: 12px; }
.fb-t { font-family: var(--disp); font-size: 1.35rem; font-weight: 800; }
.fb-x { margin-top: 6px; font-weight: 700; }
.fb-x .model { font-weight: 700; display: block; margin-top: 4px; }
.why { margin-top: 6px; font-weight: 700; font-size: .95rem; }
.fb-btns { display: grid; gap: 10px; }
.fb .btn.ghost { color: var(--ink); }

/* ---- toets ---- */
.ttitle { display: flex; flex-direction: column; flex: 1; line-height: 1.15; }
.ttitle b { font-family: var(--disp); font-size: 1.2rem; }
.ttitle span { color: var(--mut); font-size: .85rem; }
.grid { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px max(16px, env(safe-area-inset-left, 0px)) 8px max(16px, env(safe-area-inset-right, 0px)); }
.gn { width: 36px; height: 36px; border-radius: 11px; border: 2px solid var(--line); background: #fff; font-weight: 800; font-size: .88rem; color: var(--mut); font-variant-numeric: tabular-nums; }
.gn.ans { background: #dcd8ff; border-color: #b6aeff; color: var(--brand-d); }
.gn.cur { border-color: var(--ink); color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.gn.good { background: var(--green-bg); border-color: var(--green); color: var(--green-ink); }
.gn.bad { background: var(--red-bg); border-color: var(--red); color: var(--red-ink); }
.gn.half { background: #fff1d6; border-color: var(--sun); color: #8a5a00; }
.gn.skip { background: #eceff8; border-color: #c3cbe2; color: #7b84a5; }
.gn.todo { background: #fff; border-style: dashed; border-color: var(--sun-d); color: #8a5a00; }
.rfilter { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 max(16px, env(safe-area-inset-left, 0px)) 6px max(16px, env(safe-area-inset-right, 0px)); }
.pill { border: 2px solid var(--line); background: #fff; border-radius: 99px; padding: 6px 14px; font-weight: 800; font-size: .88rem; color: var(--mut); }
.pill.on { background: var(--ink); border-color: var(--ink); color: #fff; }
.verdict { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 14px 0 4px; font-weight: 700; }
.v { border-radius: 99px; padding: 4px 14px; font-weight: 800; }
.v.good { background: var(--green-bg); color: var(--green-ink); } .v.bad { background: var(--red-bg); color: var(--red-ink); } .v.skip { background: #eceff8; color: #5b6385; }
.review .why { background: #fff8e1; border-radius: 14px; padding: 10px 14px; margin-top: 10px; color: #6b4a00; }
.ans-box { border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; margin-bottom: 10px; background: #fafbff; }
.ans-box h4 { font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); margin-bottom: 4px; font-family: var(--font); font-weight: 800; }
.ans-box.model { border-color: var(--green); background: var(--green-bg); }
.mark-q { font-weight: 800; margin: 12px 0 8px; }
.marks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mk { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 10px 6px; font-weight: 800; box-shadow: 0 3px 0 var(--line); }
.mk.on.m1 { background: var(--green); border-color: var(--green-d); color: #fff; } .mk.on.m5 { background: var(--sun); border-color: var(--sun-d); color: #4a3200; } .mk.on.m0 { background: var(--red); border-color: var(--red-d); color: #fff; }

/* ---- resultaat ---- */
.sum { text-align: center; padding-top: 28px; }
.sum-e { font-size: 5rem; line-height: 1; animation: pop .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
.sum h1 { font-size: 2rem; margin: 10px 0 4px; color: var(--brand-d); }
.stars.big { display: flex; justify-content: center; gap: 6px; margin: 6px 0; }
.stars.big i { font-style: normal; font-size: 3rem; color: #d3d9ea; }
.stars.big i.on { color: var(--sun); text-shadow: 0 3px 0 var(--sun-d); animation: pop .5s cubic-bezier(.3,1.6,.5,1) both; }
.stars.big i:nth-child(2) { animation-delay: .12s; } .stars.big i:nth-child(3) { animation-delay: .24s; }
.score { font-family: var(--disp); font-size: 3rem; font-weight: 800; line-height: 1; margin-top: 4px; }
.score small { display: block; font-family: var(--font); font-size: .9rem; font-weight: 700; color: var(--mut); margin-top: 4px; }
.msg { margin: 12px auto; max-width: 440px; }
.grade { display: inline-flex; flex-direction: column; background: #fff; border: 2px solid var(--line); border-radius: 22px; padding: 10px 30px; margin: 14px 0; box-shadow: 0 4px 0 var(--line); }
.grade span { font-size: .85rem; color: var(--mut); font-weight: 800; } .grade b { font-family: var(--disp); font-size: 2.6rem; color: var(--brand-d); line-height: 1.1; }
.missed { text-align: left; background: #fff; border: 2px solid var(--line); border-radius: 20px; padding: 14px 18px; margin: 14px 0; }
.missed h3 { font-size: 1.1rem; margin-bottom: 6px; }
.missed ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: .95rem; }
.missed ul.links { list-style: none; padding: 0; }
.missed.good { border-color: var(--green); background: var(--green-bg); }
.perfect { font-weight: 800; color: var(--green-ink); margin: 14px 0; }
.sum-btns { display: grid; gap: 12px; max-width: 420px; margin: 20px auto 0; }

/* ---- dialogen, toast, confetti ---- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(29,33,64,.55); display: grid; place-items: center; padding: 16px; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.dialog { background: #fff; border-radius: 26px; padding: 22px; width: min(420px, 100%); box-shadow: 0 8px 0 rgba(0,0,0,.12); }
.dialog h3 { font-size: 1.4rem; margin-bottom: 8px; } .dialog p { margin-bottom: 12px; }
.dialog .small { color: var(--mut); font-size: .88rem; }
.mbtns { display: grid; gap: 10px; margin-top: 12px; } .mbtns.col { gap: 10px; }
.switch { display: flex; align-items: center; gap: 12px; font-weight: 800; padding: 8px 0; }
.switch input { width: 22px; height: 22px; accent-color: var(--brand); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 16px; font-weight: 800; z-index: 60; max-width: calc(100% - 32px); text-align: center; animation: up .2s; transition: opacity .4s; }
.toast.out { opacity: 0; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 70; }
.confetti span { position: absolute; top: -40px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }

@media (min-width: 700px) {
  .run-main { padding-bottom: 210px; } .qt { font-size: 1.55rem; } .optgrid { gap: 14px; }
  .lv:nth-child(odd) { margin-right: 60px; } .lv:nth-child(even) { margin-left: 60px; }
}
@media (max-width: 380px) { .brand h1 { font-size: 1.6rem; } .lv:nth-child(odd) { margin-right: 8px; } .lv:nth-child(even) { margin-left: 8px; } .gap { min-width: 76px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Oefentoetsen: gemengde vraagtypes */
.ptsb { background: #fff1d6; color: #8a5a00; border-radius: 99px; padding: 4px 10px; font-size: .78rem; font-weight: 800; }
.qcard.deep { border-color: #c9b8ff; box-shadow: 0 5px 0 #c9b8ff; }
.stlist { display: grid; gap: 10px; margin-top: 4px; }
.stel { border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; background: #fafbff; display: grid; gap: 8px; min-width: 0; }
.stel p { margin: 0; font-weight: 700; }
.stel small { color: var(--mut); font-weight: 600; }
.stel.good { border-color: var(--green); background: var(--green-bg); }
.stel.bad { border-color: var(--red); background: var(--red-bg); }
.stel.skip { border-color: #c3cbe2; background: #eceff8; }
.stv { font-size: .92rem; }
.tfpair { display: flex; gap: 8px; }
.tfb { flex: 1; padding: 10px 12px; font-size: 1rem; }
.defs { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 6px; }
.defs li { display: flex; gap: 10px; align-items: flex-start; background: #f6f8fd; border: 2px solid var(--line); border-radius: 14px; padding: 8px 10px; min-width: 0; }
.defs b { flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: .9rem; }
.defs span { min-width: 0; font-weight: 700; }
.mlist { display: grid; gap: 8px; }
.mrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 2px solid var(--line); border-radius: 14px; padding: 8px 10px; background: #fff; }

.olist li.ok { color: var(--green-ink); font-weight: 800; }
.olist li.no { color: var(--red-ink); font-weight: 800; }

/* Flitskaarten */
.herhaal.fl { background: linear-gradient(135deg, #ffb020, #ef6c1a); box-shadow: 0 5px 0 #c2570f; }
.herhaal.fl:active { box-shadow: 0 2px 0 #c2570f; }
.flbtn { width: 100%; margin-top: 14px; }
.flopt { display: flex; align-items: center; gap: 10px; background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 10px 14px; margin: 4px 0 12px; font-weight: 800; }
.flopt input { width: 22px; height: 22px; accent-color: var(--brand); }
.fdecks { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.fl-tag { text-align: center; font-weight: 800; color: color-mix(in srgb, var(--lc) 70%, #000); margin: 0 0 10px; }
.fcard { display: grid; perspective: 1200px; cursor: pointer; outline-offset: 4px; }
.fface { grid-area: 1 / 1; min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 22px 18px; border-radius: 28px; background: #fff; border: 3px solid var(--lc); box-shadow: 0 6px 0 var(--lc); backface-visibility: hidden; -webkit-backface-visibility: hidden; transition: transform .45s cubic-bezier(.3,.9,.3,1); min-width: 0; }
.fface.front { transform: rotateY(0deg); }
.fface.back { transform: rotateY(180deg); background: color-mix(in srgb, var(--lc) 12%, #fff); }
.fcard.flip .front { transform: rotateY(-180deg); }
.fcard.flip .back { transform: rotateY(0deg); }

/* ===== Oefentoetsen ===== */
function rngFrom(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = h >>> 0;
  return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
/* tm = toetsvraag met goed antwoord eerst; de volgorde wordt vast door een seed bepaald */
function tm(id, t, q, correct, wrongs, o = {}) {
  const idx = [0, 1, 2, 3].slice(0, 1 + wrongs.length);
  const rng = rngFrom(id);
  for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  const all = [correct, ...wrongs];
  const res = { type: "mc", t, q, opts: idx.map((i) => all[i]), ans: idx.indexOf(0), ...o };
  if (o.optImgs) res.optImgs = idx.map((i) => o.optImgs[i]);
  return res;
}

function shuf(arr, rng) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function shufNot(n, rng) { let idx, k = 0; do { idx = shuf([...Array(n).keys()], rng); } while (idx.every((v, i) => v === i) && k++ < 30); return idx; }
const tmulti = (t, q, items, o = {}) => ({ type: "multi", t, q, items: items.map(([s, v, why]) => ({ s, v, why })), ...o });
function tmatch(id, t, q, pairs, o = {}) {
  const idx = shufNot(pairs.length, rngFrom(id));
  return { type: "match", t, q, terms: pairs.map((p) => p[0]), defs: idx.map((i) => pairs[i][1]), key: pairs.map((_, i) => idx.indexOf(i)), ...o };
}
function torder(id, t, q, items, o = {}) {
  const idx = shufNot(items.length, rngFrom(id));
  return { type: "order", t, q, items: idx.map((i) => items[i]), key: items.map((_, p) => idx.indexOf(p)), model: items, ...o };
}
const tk = (t, q, model, crit) => to(t, q, model, { kort: true, crit });

/* ============ Antwoorden beoordelen ============ */
const norm = (s) => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/(\d)[.\s](?=\d{3}\b)/g, "$1").replace(/[^a-z0-9]+/g, " ").trim();
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function matchFill(text, accept) {
  const t = norm(text).split(" ").filter(Boolean);
  for (const a of accept) {
    const na = norm(a), nac = na.replace(/ /g, "");
    for (let n = 1; n <= 4; n++) for (let i = 0; i + n <= t.length; i++) {
      const cand = t.slice(i, i + n).join(" "), cc = cand.replace(/ /g, "");
      if (cand === na || cc === nac) return true;
      if (nac.length >= 5 && lev(cc, nac) <= 1) return true;
    }
  }
  return false;
}
function evalOpen(text, q) {
  const nt = " " + norm(text) + " ";
  if (norm(text).split(" ").filter(Boolean).length < 2) return { ok: false, hit: 0 };
  let hit = 0;
  for (const g of q.groups) {
    if (g.some((kw) => { const exact = kw.endsWith("|"), k = norm(kw.replace("|", "")); return exact ? nt.includes(" " + k + " ") : nt.includes(" " + k); })) hit++;
  }
  return { ok: hit >= q.need, hit };
}

/* ============ Een ronde spelen ============ */
function startRun(o) {

    let speak = false;

    return { q, attempts: 0, first: null, done: false, speak };

  go("run");
}
function startRound(l, r) { const L = LEVELS[l - 1], rd = L.rounds[r - 1]; startRun({ kind: "round", l, r, title: `${L.title} · ${rd.name}`, color: L.color, qs: rd.qs }); }
function startHerhaal() {
  const pool = herhaalPool(); if (!pool.length) return toast("Rond eerst een ronde af, dan kun je dagelijks herhalen.");
  const n = Math.min(15, pool.length), groups = {};
  pool.forEach((q) => (groups[q.type] = groups[q.type] || []).push(q));
  const pick = (arr) => { const w = arr.map((q) => 1 + 2 * (S.wrong[q.id] || 0)), tot = w.reduce((x, y) => x + y, 0); let x = Math.random() * tot, k = 0; while (k < arr.length - 1 && (x -= w[k]) > 0) k++; return arr.splice(k, 1)[0]; };
  const qs = [];
  /* om en om uit elk vraagtype, zodat de mix zo gevarieerd mogelijk is */
  while (qs.length < n) {
    const kinds = shuffle(Object.keys(groups).filter((t) => groups[t].length));
    if (!kinds.length) break;
    for (const t of kinds) { if (qs.length < n) qs.push(pick(groups[t])); }
  }
  startRun({ kind: "herhaal", title: "Dagelijkse herhaling", color: "#5B4BFF", qs: shuffle(qs) });
}
function renderRun() {
  app.innerHTML = `<div class="run" style="--lc:${R.color}"><header class="run-top"><button type="button" class="iconbtn" data-act="quit" aria-label="Stoppen">✕</button><div class="bar" role="progressbar" aria-label="Voortgang"><i id="pb"></i></div><div class="cnt" id="cnt"></div></header>

}

  const body = q.type === "cloze" ? "" : q.type === "fill" ? `<h2 class="qt">${esc(q.q).replace(/___/g, '<span class="blank"></span>')}</h2>` : `<h2 class="qt">${esc(q.q)}</h2>`;
  const tts = "speechSynthesis" in window ? `<button type="button" class="tts" data-act="say" aria-label="Lees voor">🔊</button>` : "";

function noteWrong(id, score, undo) {

/* ============ Oefentoetsen ============ */
const fmtP = (x) => String(Math.round(x * 100) / 100).replace(".", ",");
const qPts = (q) => q.pts || 1;
const fullArr = (a, n) => Array.isArray(a) && a.length === n && a.every((v) => v !== null && v !== undefined);
function qAnswered(q, c, k) {
  const a = c.answers[k];
  if (q.type === "mc") return a !== null && a !== undefined;
  if (q.type === "multi") return fullArr(a, q.items.length);
  if (q.type === "match") return fullArr(a, q.terms.length);
  if (q.type === "order") return Array.isArray(a) && a.length === q.items.length;
  return (c.texts[k] || "").trim().length > 0;
}
function qBlank(q, c, k) {
  const a = c.answers[k];
  if (q.type === "mc") return a === null || a === undefined;
  if (q.type === "open") return !(c.texts[k] || "").trim();
  return !Array.isArray(a) || a.length === 0 || a.every((v) => v === null || v === undefined);
}
/* punten voor één vraag (0 t/m qPts) */
function qGot(q, k, c) {
  const a = c.answers[k];
  if (q.type === "mc") return a === q.ans ? 1 : 0;
  if (q.type === "multi") return Array.isArray(a) ? a.filter((v, i) => v === q.items[i].v).length / q.items.length : 0;
  if (q.type === "match") return Array.isArray(a) ? a.filter((v, i) => v === q.key[i]).length / q.terms.length : 0;
  if (q.type === "order") { if (!Array.isArray(a)) return 0; const ok = a.filter((v, i) => v === q.key[i]).length; return ok === q.key.length ? 1 : ok >= Math.ceil(q.key.length / 2) ? 0.5 : 0; }
  return c.marks[k] === undefined ? 0 : c.marks[k] * qPts(q);
}
const TAGS = { mc: "Meerkeuze", multi: "Juist of onjuist", match: "Koppelen", order: "Volgorde" };
const tagOf = (q) => TAGS[q.type] || (q.deep ? "Verdiepende vraag" : q.kort ? "Korte open vraag" : "Open vraag");
const ptsBadge = (q) => (qPts(q) > 1 ? `<span class="ptsb">${qPts(q)} punten</span>` : "");

function startToets(id, fresh) {
  const def = TOETSEN.find((t) => t.id === id), rec = (S.toetsen[id] = S.toetsen[id] || {}), ver = def.v || 1;
  if (!rec.cur || rec.cur.phase === "done" || fresh || (rec.cur.v || 1) !== ver || rec.cur.answers.length !== def.qs.length) rec.cur = { v: ver, answers: def.qs.map(() => null), texts: def.qs.map(() => ""), idx: 0, phase: "doing", marks: {} };
  T = { def, rec, filter: "all", rpos: 0 }; save();
  go(rec.cur.phase === "review" ? "review" : "toets");
}
const qBody = (q) => `${q.img ? IMGH(q.img, "", "qimg") : ""}${q.gallery ? `<div class="gallery">${q.gallery.map((k, i) => `<figure>${IMGH(k, "Afbeelding " + (i + 1))}<figcaption>${i + 1}</figcaption></figure>`).join("")}</div>` : ""}`;
const defsHtml = (q) => `<ol class="defs">${q.defs.map((d, x) => `<li><b>${LET[x]}</b><span>${esc(d)}</span></li>`).join("")}</ol>`;
function toetsAnsHtml(q, c, i) {
  const a = c.answers[i];
  if (q.type === "mc") return mcOptionsHtml(q, q.opts.map((_, k) => k), (pos) => (a === pos ? " sel" : ""));
  if (q.type === "multi") { const arr = a || []; return `<div class="stlist">${q.items.map((it, j) => `<div class="stel"><p>${md(it.s)}</p><div class="tfpair"><button type="button" class="chip tfb${arr[j] === true ? " on" : ""}" data-j="${j}" data-v="1">Juist</button><button type="button" class="chip tfb${arr[j] === false ? " on" : ""}" data-j="${j}" data-v="0">Onjuist</button></div></div>`).join("")}</div>`; }
  if (q.type === "match") { const arr = a || []; return `${defsHtml(q)}<div class="mlist">${q.terms.map((t, j) => `<label class="mrow"><span>${esc(t)}</span><select class="msel" data-j="${j}"><option value="">Kies…</option>${q.defs.map((_, x) => `<option value="${x}"${arr[j] === x ? " selected" : ""}>${LET[x]}</option>`).join("")}</select></label>`).join("")}</div>`; }
  if (q.type === "order") return `<div class="ord-ans" id="oa"></div><div class="ord-pool" id="op"></div>`;
  return `<div id="qa" class="qa">${Voice.area({ text: c.texts[i] || "", mode: "type" }, true)}</div>`;
}
function toetsBind(q, c, i) {
  const upd = () => { save(); const g = $$(".gn")[i]; if (g) g.classList.toggle("ans", qAnswered(q, c, i)); };
  const arrOf = (n) => (Array.isArray(c.answers[i]) ? c.answers[i].slice() : Array(n).fill(null));
  if (q.type === "mc") $$(".opt").forEach((b) => (b.onclick = () => { c.answers[i] = +b.dataset.i; $$(".opt").forEach((x) => x.classList.toggle("sel", x === b)); upd(); }));
  else if (q.type === "multi") $$(".tfb").forEach((b) => (b.onclick = () => { const arr = arrOf(q.items.length); arr[+b.dataset.j] = b.dataset.v === "1"; c.answers[i] = arr; $$(".tfb").forEach((x) => { if (x.dataset.j === b.dataset.j) x.classList.toggle("on", x === b); }); upd(); }));
  else if (q.type === "match") $$(".msel").forEach((s) => (s.onchange = () => { const arr = arrOf(q.terms.length); arr[+s.dataset.j] = s.value === "" ? null : +s.value; c.answers[i] = arr; upd(); }));
  else if (q.type === "order") {
    const picked = Array.isArray(c.answers[i]) ? c.answers[i].slice() : [];
    const draw = () => {
      $("#oa").innerHTML = picked.length ? picked.map((idx, p) => `<button type="button" class="ochip placed" data-p="${p}"><span class="num">${p + 1}</span>${esc(q.items[idx])}</button>`).join("") : `<p class="ord-ph">Tik de stappen in de goede volgorde. Tik op een stap om hem weg te halen.</p>`;
      $("#op").innerHTML = q.items.map((_, x) => x).filter((x) => !picked.includes(x)).map((x) => `<button type="button" class="ochip" data-i="${x}">${esc(q.items[x])}</button>`).join("");
      $$("#oa .placed").forEach((b) => (b.onclick = () => { picked.splice(+b.dataset.p, 1); c.answers[i] = picked.slice(); draw(); upd(); }));
      $$("#op .ochip").forEach((b) => (b.onclick = () => { picked.push(+b.dataset.i); c.answers[i] = picked.slice(); draw(); upd(); }));
    };
    draw();
  } else {
    const st = { text: c.texts[i] || "", mode: "type", listening: false };
    Voice.wire($("#qa"), st, () => { c.texts[i] = st.text; save(); $$(".gn")[i].classList.toggle("ans", st.text.trim().length > 0); }, true);
  }
}
function renderToets() {
  const c = T.rec.cur, qs = T.def.qs, i = c.idx, q = qs[i], n = qs.length;
  const grid = qs.map((qq, k) => { const a = qAnswered(qq, c, k); return `<button type="button" class="gn ${k === i ? "cur" : ""} ${a ? "ans" : ""}" data-act="tgo" data-k="${k}" aria-label="Vraag ${k + 1}${a ? ", beantwoord" : ""}">${k + 1}</button>`; }).join("");
  app.innerHTML = `<div class="run toets" style="--lc:#5B4BFF"><header class="run-top"><button type="button" class="iconbtn" data-act="texit" aria-label="Opslaan en stoppen">✕</button><div class="ttitle"><b>${esc(T.def.title)}</b><span>Vraag ${i + 1} van ${n}</span></div></header>
  <div class="grid">${grid}</div>
  <main class="run-main"><div class="qwrap"><div class="qcard${q.deep ? " deep" : ""}"><div class="qtop"><span class="tag">${tagOf(q)}</span>${ptsBadge(q)}${"speechSynthesis" in window ? `<button type="button" class="tts" data-act="tsay" aria-label="Lees voor">🔊</button>` : ""}</div>${qBody(q)}<h2 class="qt">${md(q.q)}</h2>${toetsAnsHtml(q, c, i)}</div></div></main>
  <footer class="run-foot tnav"><button type="button" class="btn ghost" data-act="tprev" ${i === 0 ? "disabled" : ""}>‹ Vorige</button>${i < n - 1 ? `<button type="button" class="btn big" data-act="tnext">Volgende ›</button>` : `<button type="button" class="btn big green" data-act="tsubmit">Inleveren ✔</button>`}</footer></div>`;
  toetsBind(q, c, i);
}
function submitToets(force) {
  const c = T.rec.cur, qs = T.def.qs;
  const un = qs.filter((q, k) => !qAnswered(q, c, k)).length;
  if (un > 0 && !force) return modal(`<h3>Nog niet alles beantwoord</h3><p>Je hebt <b>${un}</b> ${un === 1 ? "vraag" : "vragen"} nog niet (helemaal) beantwoord. Wil je toch inleveren?</p><div class="mbtns"><button type="button" class="btn ghost" data-act="mclose">Nog even verder</button><button type="button" class="btn red" data-act="tforce">Toch inleveren</button></div>`);
  c.phase = "review"; c.idx = 0; save(); T.filter = "all"; T.rpos = 0; go("review");
}
const toetsMax = () => T.def.qs.reduce((a, q) => a + qPts(q), 0);
function toetsScore() { const c = T.rec.cur; let s = 0; T.def.qs.forEach((q, k) => { s += qGot(q, k, c); }); return Math.round(s * 100) / 100; }
function rlist() { const c = T.rec.cur; return T.def.qs.map((q, k) => k).filter((k) => T.filter === "all" || qGot(T.def.qs[k], k, c) < qPts(T.def.qs[k])); }
function reviewBody(q, k, c) {
  const verdictCls = (mine, ok) => (mine === null || mine === undefined ? "skip" : ok ? "good" : "bad");
  const got = qGot(q, k, c), line = q.type === "open" ? "" : `<p class="ptsline">Punten: <b>${fmtP(got)}</b> van ${qPts(q)}</p>`;
  if (q.type === "mc") {
    const mine = c.answers[k];
    const body = mcOptionsHtml(q, q.opts.map((_, i) => i), (pos) => (pos === q.ans ? " right" : pos === mine ? " wrong" : "")).replace(/<button/g, "<button disabled");
    const verdict = mine === null ? `<span class="v skip">Niet beantwoord</span>` : mine === q.ans ? `<span class="v good">✅ Goed</span>` : `<span class="v bad">❌ Fout</span>`;
    return `${body}<div class="verdict">${verdict}${mine !== null && mine !== q.ans ? `<span>Jouw antwoord: <b>${q.optImgs ? "afbeelding " + LET[mine] : esc(q.opts[mine])}</b></span>` : ""}</div><p class="why">💡 ${esc(q.why || "")}</p>`;
  }
  if (q.type === "multi") return `<div class="stlist">${q.items.map((it, j) => { const mine = (c.answers[k] || [])[j], ok = mine === it.v; return `<div class="stel ${verdictCls(mine, ok)}"><p>${md(it.s)}</p><div class="stv">${mine === null || mine === undefined ? "Niet beantwoord" : ok ? "✅ Goed" : "❌ Fout"} · het is <b>${it.v ? "juist" : "onjuist"}</b></div><small>💡 ${esc(it.why || "")}</small></div>`; }).join("")}</div>${line}`;
  if (q.type === "match") return `${defsHtml(q)}<div class="stlist">${q.terms.map((t, j) => { const mine = (c.answers[k] || [])[j], ok = mine === q.key[j]; return `<div class="stel ${verdictCls(mine, ok)}"><p><b>${esc(t)}</b></p><div class="stv">Jouw keuze: <b>${mine === null || mine === undefined ? "–" : LET[mine]}</b> ${ok ? "✅" : `❌ goed is <b>${LET[q.key[j]]}</b>`}</div></div>`; }).join("")}</div>${line}`;
  if (q.type === "order") {
    const mine = Array.isArray(c.answers[k]) ? c.answers[k] : [];
    return `<div class="ans-box"><h4>Jouw volgorde</h4>${mine.length ? `<ol class="olist">${mine.map((idx, p) => `<li class="${idx === q.key[p] ? "ok" : "no"}">${esc(q.items[idx])}</li>`).join("")}</ol>` : "<p><i>Niet beantwoord</i></p>"}</div><div class="ans-box model"><h4>Goede volgorde</h4><ol class="olist">${q.model.map((t) => `<li>${esc(t)}</li>`).join("")}</ol></div>${line}`;
  }
  const m = c.marks[k], P = qPts(q);
  const labels = [[1, "👍 Goed", "m1"], [0.5, "🤏 Half", "m5"], [0, "👎 Niet goed", "m0"]].map(([v, t, cl]) => [v, P > 1 ? `${t} (${fmtP(v * P)})` : t, cl]);
  return `<div class="ans-box"><h4>Jouw antwoord</h4><p>${(c.texts[k] || "").trim() ? esc(c.texts[k]) : "<i>Niet beantwoord</i>"}</p></div><div class="ans-box model"><h4>Voorbeeldantwoord</h4><p>${esc(q.model)}</p></div>
  ${q.crit ? `<div class="ans-box crit"><h4>Hierop let je bij het nakijken</h4><ul>${q.crit.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
  <p class="mark-q">Kijk samen na: hoeveel punten krijgt dit antwoord?</p><div class="marks">${labels.map(([v, t, cl]) => `<button type="button" class="mk ${cl} ${m === v ? "on" : ""}" data-act="mark" data-v="${v}" data-k="${k}">${t}</button>`).join("")}</div>`;
}
function renderReview() {
  const c = T.rec.cur, qs = T.def.qs, list = rlist();
  if (!list.length) { T.filter = "all"; return renderReview(); }
  T.rpos = Math.min(T.rpos, list.length - 1); const k = list[T.rpos], q = qs[k];
  const state = (j) => { const x = qs[j]; if (x.type === "open") { const m = c.marks[j]; return m === undefined ? "todo" : m === 1 ? "good" : m === 0 ? "bad" : "half"; } if (qBlank(x, c, j)) return "skip"; const g = qGot(x, j, c) / qPts(x); return g >= 1 ? "good" : g <= 0 ? "bad" : "half"; };
  const grid = qs.map((_, j) => `<button type="button" class="gn ${state(j)} ${j === k ? "cur" : ""}" data-act="rgo" data-k="${j}" aria-label="Vraag ${j + 1}">${j + 1}</button>`).join("");
  const open = qs.some((x, j) => x.type === "open" && c.marks[j] === undefined);
  const last = T.rpos === list.length - 1;
  app.innerHTML = `<div class="run toets review" style="--lc:#14B8A6"><header class="run-top"><button type="button" class="iconbtn" data-act="texit" aria-label="Opslaan en stoppen">✕</button><div class="ttitle"><b>Samen nakijken</b><span>Punten tot nu toe: ${fmtP(toetsScore())} van ${fmtP(toetsMax())}</span></div></header>
  <div class="grid">${grid}</div><div class="rfilter"><button type="button" class="pill ${T.filter === "all" ? "on" : ""}" data-act="rfilter" data-f="all">Alle vragen</button><button type="button" class="pill ${T.filter === "wrong" ? "on" : ""}" data-act="rfilter" data-f="wrong">Alleen wat niet goed was</button></div>
  <main class="run-main"><div class="qwrap"><div class="qcard${q.deep ? " deep" : ""}"><div class="qtop"><span class="tag">Vraag ${k + 1} van ${qs.length} · ${tagOf(q)}</span>${ptsBadge(q)}</div>${qBody(q)}<h2 class="qt">${md(q.q)}</h2>${reviewBody(q, k, c)}</div></div></main>
  <footer class="run-foot tnav"><button type="button" class="btn ghost" data-act="rprev" ${T.rpos === 0 ? "disabled" : ""}>‹ Vorige</button>${last ? `<button type="button" class="btn big green" data-act="rfinish" ${open ? "disabled" : ""}>${open ? "Kijk eerst de open vragen na" : "Afronden ✔"}</button>` : `<button type="button" class="btn big" data-act="rnext">Volgende ›</button>`}</footer></div>`;
}
function finishToets() {
  const c = T.rec.cur, qs = T.def.qs, score = toetsScore(), max = toetsMax(), grade = Math.round((1 + (9 * score) / max) * 10) / 10;
  const topics = {};
  qs.forEach((q, k) => { const t = q.t; topics[t] = topics[t] || { ok: 0, n: 0 }; topics[t].n += qPts(q); topics[t].ok += qGot(q, k, c); });
  const res = { score, max, grade, topics }; c.phase = "done"; c.result = res;
  if (!T.rec.best || score / max >= T.rec.best.score / T.rec.best.max) T.rec.best = { score, max, grade };
  touchStreak(); save(); sfx("win"); if (grade >= 5.5) burst(); go("toetsdone");
}
function renderToetsDone() {
  const r = T.rec.cur.result; if (!r) { T.rec.cur.phase = "review"; return go("review"); }
  const weak = Object.entries(r.topics).filter(([t, v]) => v.n && v.ok / v.n < 0.75 && LEVELS[t - 1]).map(([t]) => +t);
  const good = Object.entries(r.topics).filter(([t, v]) => v.n && v.ok / v.n >= 0.75 && LEVELS[t - 1]).map(([t]) => +t);
  const emo = r.grade >= 8 ? "🏆" : r.grade >= 5.5 ? "🎉" : "💪";
  app.innerHTML = `<div class="sum"><div class="sum-e" aria-hidden="true">${emo}</div><h1>${esc(T.def.title)} klaar!</h1><div class="score">${fmtP(r.score)} / ${fmtP(r.max)}<small>punten</small></div>
  <div class="grade"><span>Cijfer (schatting)</span><b>${fmtGrade(r.grade)}</b></div>
  ${good.length ? `<div class="missed good"><h3>Dit gaat goed 👍</h3><ul>${good.map((t) => `<li>${LEVELS[t - 1].emoji} ${esc(LEVELS[t - 1].title)}</li>`).join("")}</ul></div>` : ""}
  ${weak.length ? `<div class="missed"><h3>Hier kun je nog op oefenen</h3><ul class="links">${weak.map((t) => `<li><button type="button" class="linkbtn" data-act="level" data-l="${t}">${LEVELS[t - 1].emoji} ${esc(LEVELS[t - 1].title)} ›</button></li>`).join("")}</ul></div>` : `<p class="perfect">Alles onder de knie! 🌟</p>`}
  <div class="sum-btns"><button type="button" class="btn big" data-act="toets-fresh" data-t="${T.def.id}">Deze toets opnieuw maken</button><button type="button" class="btn ghost" data-act="tnakijk">Antwoorden nog eens bekijken</button><button type="button" class="btn ghost" data-act="home">Terug naar de kaart</button></div></div>`;
}

/* ============ Instellingen en dialogen ============ */
function modal(html) {
  closeModal(); const m = document.createElement("div"); m.className = "overlay"; m.id = "modal";
  m.innerHTML = `<div class="dialog" role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(m);
  const f = $("button", m); if (f) f.focus();
}
function closeModal() { const m = $("#modal"); if (m) m.remove(); }
function settings() {
  const dev = location.hash === "#dev";
  modal(`<h3>Instellingen</h3>
  <label class="switch"><input type="checkbox" id="sndchk" ${S.sound ? "checked" : ""}><span>🔊 Geluidjes</span></label>
  <p class="small">Je voortgang staat alleen in deze browser op dit apparaat.</p>
  <div class="mbtns col"><button type="button" class="btn ghost red-t" data-act="reset1">Voortgang wissen</button>${dev ? `<button type="button" class="btn ghost" data-act="unlockall">🔓 Alles ontgrendelen (test)</button>` : ""}<button type="button" class="btn" data-act="mclose">Klaar</button></div>`);
  $("#sndchk").onchange = (e) => { S.sound = e.target.checked; save(); if (S.sound) sfx("ok"); };
}

/* ============ Acties ============ */
const ACT = {
  home: () => go("home"),
  level: (t) => go("level", { l: +t.dataset.l }),
  locked: (t) => toast(`Rond eerst level ${+t.dataset.l - 1} af (alle 4 rondes minstens 75%).`),
  round: (t) => startRound(+t.dataset.l, +t.dataset.r),
  rlocked: () => toast("Haal eerst minstens 75% in de vorige ronde."),
  herhaal: () => startHerhaal(),
  check: () => check(), next: () => nextQ(), override: () => override(),
  say: () => { if (R && R.cur) say(questionText(R.cur.q)); },
  quit: () => modal(`<h3>Stoppen?</h3><p>Je voortgang in deze ronde gaat dan verloren.</p><div class="mbtns"><button type="button" class="btn big" data-act="mclose">Doorgaan met leren</button><button type="button" class="btn ghost red-t" data-act="quitgo">Stoppen</button></div>`),
  quitgo: () => { closeModal(); const l = R && R.kind === "round" ? R.l : 0; R = null; l ? go("level", { l }) : go("home"); },
  mclose: () => closeModal(),
  settings: () => settings(),
  reset1: (t) => { if (t.dataset.sure) { S = defaults(); save(); closeModal(); go("home"); toast("Voortgang gewist."); } else { t.dataset.sure = 1; t.textContent = "Weet je het zeker? Tik nog een keer"; } },
  unlockall: () => { LEVELS.forEach((L) => L.rounds.forEach((rd, i) => (S.rounds[rk(L.id, i + 1)] = { best: 1, stars: 3, passed: true, tries: 1 }))); save(); closeModal(); go("home"); },
  toets: (t) => startToets(+t.dataset.t),
  "toets-fresh": (t) => startToets(+t.dataset.t, true),
  tgo: (t) => { T.rec.cur.idx = +t.dataset.k; save(); renderToets(); window.scrollTo(0, 0); },
  tprev: () => { T.rec.cur.idx = Math.max(0, T.rec.cur.idx - 1); save(); renderToets(); window.scrollTo(0, 0); },
  tnext: () => { T.rec.cur.idx = Math.min(T.def.qs.length - 1, T.rec.cur.idx + 1); save(); renderToets(); window.scrollTo(0, 0); },
  tsay: () => say(questionText(T.def.qs[T.rec.cur.idx])),
  tsubmit: () => submitToets(false),
  tforce: () => { closeModal(); submitToets(true); },
  texit: () => { Voice.stop(); save(); T = null; go("home"); },
  rgo: (t) => { const l = rlist(); T.rpos = Math.max(0, l.indexOf(+t.dataset.k)); if (l.indexOf(+t.dataset.k) < 0) { T.filter = "all"; T.rpos = +t.dataset.k; } renderReview(); window.scrollTo(0, 0); },
  rprev: () => { T.rpos = Math.max(0, T.rpos - 1); renderReview(); window.scrollTo(0, 0); },
  rnext: () => { T.rpos++; renderReview(); window.scrollTo(0, 0); },
  rfilter: (t) => { T.filter = t.dataset.f; T.rpos = 0; renderReview(); },
  mark: (t) => { T.rec.cur.marks[+t.dataset.k] = +t.dataset.v; save(); renderReview(); },
  flits: () => { F = null; go("flits", { s: "pick" }); },
  flitslevel: (t) => startFlits(+t.dataset.l),
  fdeck: (t) => startFlits(+t.dataset.l),
  flip: () => fflip(), fknow: () => frate(true), fagain: () => frate(false),
  fsay: () => { if (F && F.queue.length) { const c = FL[F.queue[0]]; say(F.flipped ? c.back : c.front); } },
  flitsstop: () => { F = null; go("flits", { s: "pick" }); },
  freset: (t) => { if (t.dataset.sure) { S.flits = {}; save(); renderFlits(); toast("Gewist."); } else { t.dataset.sure = 1; t.textContent = "Weet je het zeker? Tik nog een keer"; } },
  rfinish: () => finishToets(),
  tnakijk: () => { T.rec.cur.phase = "review"; T.rec.cur.result = null; T.filter = "all"; T.rpos = 0; go("review"); },
};
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (!t || t.disabled) return;
  const f = ACT[t.dataset.act]; if (f) f(t, e);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
  if (V.screen === "flits" && V.s === "play" && F && F.queue.length && !e.target.closest("button, input, textarea, select")) {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); fflip(); }
    else if (F.flipped && (e.key === "ArrowRight" || e.key === "1")) frate(true);
    else if (F.flipped && (e.key === "ArrowLeft" || e.key === "2")) frate(false);
  }
  if (e.key === "Enter" && V.screen === "run" && R && !e.target.closest("textarea") && !e.target.closest("button")) {
    if (R.res) nextQ(); else if ($("#chk") && !$("#chk").disabled) check();
  }
});
/* Een afgeronde toets die weer wordt geopend via "Antwoorden bekijken" houdt zijn punten */
render();

</script>
